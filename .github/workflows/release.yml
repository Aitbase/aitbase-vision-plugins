# Publishes a GitHub release with every plugin built as WebAssembly when a version tag (v0.1.0)
# is pushed. Each plugin keeps its own version from plugin.json; the tag versions the set.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag is a version
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' ||
            { echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1; }

  wasm:
    needs: verify
    uses: ./.github/workflows/wasm-packages.yml

  publish:
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-packages
          path: dist
      - name: Write release notes
        run: |
          sdk=$(cat SDK_VERSION)
          {
            echo "Signed WebAssembly packages of the plugins in this repository, for devices with the plugin package loader."
            echo
            echo "| Plugin | Version | Package |"
            echo "|---|---|---|"
            for manifest in plugins/*/plugin.json; do
              id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$manifest")
              version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")
              echo "| \`$id\` | $version | \`$id-$version.avp\` |"
            done
            echo
            echo "Built with SDK \`$sdk\` and wasi-sdk."
            echo
            echo "## Install on a device"
            echo
            echo "1. Check the download against \`SHA256SUMS\`."
            echo "2. Copy the \`.avp\` into \`aitbase/plugins/\` on the device's SD card (create the folders if needed)."
            echo "3. Insert the card. The device checks the signature and starts the plugin; its log is \`aitbase/logs/<id>.log\` on the card."
          } > notes.md
          cat notes.md
      - name: Create the release, or add to the one made on the releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Publishing a release on GitHub's releases page creates the tag, which starts this
            # workflow: keep that release's notes, add ours below them once, and attach the packages.
            gh release view "$tag" --json body --jq .body > existing.md
            if grep -q '^## Install on a device' existing.md; then
              cp existing.md combined.md
            else
              { cat existing.md; echo; echo; cat notes.md; } > combined.md
            fi
            gh release edit "$tag" --notes-file combined.md
            gh release upload "$tag" dist/*.avp dist/SHA256SUMS --clobber
          else
            prerelease=
            case "$tag" in *-*) prerelease=--prerelease;; esac
            gh release create "$tag" dist/*.avp dist/SHA256SUMS \
              --title "$tag" --notes-file notes.md --verify-tag $prerelease
          fi
