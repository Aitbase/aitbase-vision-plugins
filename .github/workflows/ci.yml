name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      # Built from the pinned submodule, so the CLI always matches the SDK the plugins use.
      - name: Build aitbase-plugin from the SDK
        run: go -C sdk build -o "$RUNNER_TEMP/bin/aitbase-plugin" ./cmd/aitbase-plugin && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Plugins in this repository are official, so they may use the reserved aitbase.* ids.
      - name: Check plugins
        run: |
          for dir in plugins/*/; do
            echo "::group::check $dir"
            aitbase-plugin check "$dir" --sdk sdk --allow-reserved-id
            echo "::endgroup::"
          done
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build plugins and compile their UI
        run: cmake --build build -j
      - name: Package plugins
        run: |
          for dir in plugins/*/; do
            name=$(basename "$dir")
            aitbase-plugin pack "$dir" --sdk sdk --allow-reserved-id --build-dir "build/plugins/$name" --out dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/*.avp
          if-no-files-found: error

  # The same WebAssembly packages a release publishes.
  wasm:
    uses: ./.github/workflows/wasm-packages.yml
