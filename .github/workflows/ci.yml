name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      # The CLI carries the SDK the plugins build with. SDK_VERSION pins it: a release tag, or a
      # commit of the SDK before its release.
      - name: Install aitbase-plugin
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/Aitbase/aitbase-vision-plugin-sdk/cmd/aitbase-plugin@$(cat SDK_VERSION)"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/aitbase-plugin" version
      - name: Check plugins
        run: |
          for dir in plugins/*/; do
            echo "::group::check $dir"
            aitbase-plugin check "$dir"
            echo "::endgroup::"
          done
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAITBASE_SDK_DIR="$(aitbase-plugin sdk)"
      - name: Build plugins and compile their UI
        run: cmake --build build -j
      - name: Package plugins
        run: |
          for dir in plugins/*/; do
            name=$(basename "$dir")
            aitbase-plugin pack "$dir" --build-dir "build/plugins/$name" --out dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-native
          path: dist/*-native.zip
          if-no-files-found: error

  # The same WebAssembly packages a release publishes.
  wasm:
    uses: ./.github/workflows/wasm-packages.yml
