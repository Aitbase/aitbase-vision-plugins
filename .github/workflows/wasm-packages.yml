# Builds every plugin as WebAssembly and packages it for the SD card with the SDK's aitbase-plugin
# CLI (build --wasm, pack --wasm). Called by ci.yml for every change and by release.yml for tags.
name: wasm-packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      # The CLI from the pinned SDK: the same build --wasm / pack --wasm customers run. Its first
      # build downloads wasi-sdk, checked against the SHA-256 pinned in the SDK; it is cached.
      - name: Build aitbase-plugin from the SDK
        run: go -C sdk build -o "$RUNNER_TEMP/bin/aitbase-plugin" ./cmd/aitbase-plugin && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/aitbase-plugin
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('sdk/internal/wasisdk/wasisdk.go') }}
      - name: Build and package every plugin
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            echo "::group::$dir"
            aitbase-plugin build --wasm "$dir"
            # Plugins in this repository are official, so they may use the reserved aitbase.* ids.
            aitbase-plugin pack --wasm "$dir" --allow-reserved-id --out dist
            echo "::endgroup::"
          done
          (cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
