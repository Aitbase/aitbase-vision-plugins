# Builds every plugin as WebAssembly and packages it as a signed .avp for the SD card with the
# SDK's aitbase-plugin CLI (build --wasm, pack --wasm). Called by ci.yml for every change and by
# release.yml for tags.
name: wasm-packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      # The CLI carries the SDK the plugins build with. SDK_VERSION pins it: a release tag, or a
      # commit of the SDK before its release.
      - name: Install aitbase-plugin
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/Aitbase/aitbase-vision-plugin-sdk/cmd/aitbase-plugin@$(cat SDK_VERSION)"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/aitbase-plugin" version
      # The first build --wasm downloads wasi-sdk, checked against the SHA-256 pinned in the SDK.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/aitbase-plugin
          key: aitbase-plugin-${{ runner.os }}-${{ hashFiles('SDK_VERSION') }}
      - name: Build and package every plugin
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            echo "::group::$dir"
            aitbase-plugin build --wasm "$dir"
            # Plugins in this repository are official, so they may use the reserved aitbase.* ids.
            aitbase-plugin pack --wasm "$dir" --allow-reserved-id --out dist
            echo "::endgroup::"
          done
          (cd dist && sha256sum *.avp > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-packages
          path: |
            dist/*.avp
            dist/SHA256SUMS
          if-no-files-found: error
