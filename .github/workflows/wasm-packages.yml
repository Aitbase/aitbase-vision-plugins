# Builds every plugin as WebAssembly with a pinned wasi-sdk and packages it for the SD card
# (tools/package_wasm.py). Called by ci.yml for every change and by release.yml for tags.
name: wasm-packages

on:
  workflow_call:

permissions:
  contents: read

env:
  WASI_SDK_VERSION: "34.0"
  WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wasi-sdk
        run: |
          major="${WASI_SDK_VERSION%%.*}"
          name="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/$name.tar.gz"
          echo "${WASI_SDK_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - name: Build plugins as WebAssembly
        run: |
          cmake -S . -B build-wasm \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK/share/cmake/wasi-sdk-p1.cmake" -DWASI_SDK_PREFIX="$WASI_SDK" \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build-wasm -j
      - name: Package for the SD card
        run: |
          for dir in plugins/*/; do
            name=$(basename "$dir")
            python3 -I tools/package_wasm.py "$dir" "build-wasm/plugins/$name" dist --strip "$WASI_SDK/bin/llvm-strip"
          done
          (cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
